services:
  - type: web
    name: week8-chat-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: week8-chat-db
          property: connectionString

  - type: web
    name: week8-chat-frontend
    runtime: static
    buildCommand: printf "window.API_URL = '%s';\\n" "$API_URL" > frontend/config.js
    staticPublishPath: frontend
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: week8-chat-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: week8-chat-db
    plan: free
    region: singapore
    databaseName: week8_chat
    user: week8_chat
